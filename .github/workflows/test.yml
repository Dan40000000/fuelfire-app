name: Test Well Fit Pro

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'vitest.config.mjs'
      - 'ios/App/**'
      - 'scripts/run-ios-ui-tests.sh'
      - 'scripts/setup-ios-ui-tests.rb'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  free-regression-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit, contract, AI fixture, browser, visual, and accessibility tests
        run: npm run test:ci
        env:
          CI: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: output/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload food accuracy scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-accuracy-scorecard
          path: output/accuracy/
          retention-days: 14
          if-no-files-found: error

  native-ios-smoke:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor and CocoaPods
        run: npx cap sync ios

      - name: Run native launch and resume tests
        run: npm run test:ios:ui
